<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ki Fighter · Story</title>
  <link rel="stylesheet" href="campaign/story.css?v=ui-2">
  <script src="ki-audio.js?v=1" defer></script>
  <script src="area-loader.js" defer></script>
  <script src="assets/hero-animation/manifest.js" defer></script>
  <script src="campaign-cast.js?v=detailed-npcs-1" defer></script>
  <script src="campaign/dialogue.js?v=1" defer></script>
  <script src="campaign/story.js?v=ui-2" defer></script>
</head>
<body>
  <main class="story">
    <header class="story-header">
      <div class="chapter-card">
        <p class="chapter">Chapter One</p>
        <h1>The Brother from Space</h1>
      </div>
      <div class="header-actions">
        <button id="sound" type="button" aria-pressed="true" aria-label="Music and sound on">♪</button>
        <a class="back" href="index.html">Ki Fighter</a>
      </div>
    </header>
    <section class="stage" aria-label="Story map">
      <canvas id="world" width="300" height="180" aria-label="Top-down chapter map"></canvas>
      <div class="hud">
        <h2 id="area-name">Loading</h2>
        <p id="objective" aria-live="polite"></p>
        <p class="quests" id="quests"></p>
      </div>
      <div class="notice" id="notice" role="status">Loading the coast…</div>
      <button id="retry" type="button" hidden>Retry loading</button>
    </section>
    <div class="controls">
      <div id="stick" class="stick" aria-label="Virtual movement stick" aria-hidden="true"><span></span></div>
      <p class="keyboard">Move <kbd>WASD</kbd> / arrows · Talk <kbd>E</kbd> · Sound <kbd>M</kbd></p>
      <button id="interact" type="button" disabled>Interact</button>
    </div>
    <dialog id="dialog" aria-labelledby="speaker">
      <div class="talk">
        <canvas class="portrait" id="portrait" width="48" height="48" hidden aria-hidden="true"></canvas>
        <div>
          <h2 id="speaker"></h2>
          <p class="role" id="role"></p>
        </div>
        <p id="line"></p>
        <div class="topics" id="topics"></div>
        <div class="dialog-actions">
          <button id="next" type="button">Next</button>
          <button id="dismiss" type="button">Goodbye</button>
        </div>
      </div>
    </dialog>
  </main>
</body>
</html>
