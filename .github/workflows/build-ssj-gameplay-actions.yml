name: Build SSJ action poses
on:
  push:
    branches: [feature/forest-trial-vertical-slice]
    paths: [.github/workflows/build-ssj-gameplay-actions.yml, scripts/build_ssj_gameplay_actions.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/build_ssj_gameplay_actions.py
      - name: Verify action sheet dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/ssj-gameplay-actions-4x4.png')
          assert im.size==(256,384),im.size
          for row in range(4):
            assert len({im.crop((i*64,row*96,(i+1)*64,(row+1)*96)).tobytes() for i in range(4)})>=3, row
          print('16 frames, 4 rows, distinct action poses: PASS')
          PY
      - name: Commit generated sprite sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ssj-gameplay-actions-4x4.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate dedicated SSJ attack Ki hurt and KO poses"
            git pull --rebase origin feature/forest-trial-vertical-slice
            git push origin HEAD:feature/forest-trial-vertical-slice
          fi
