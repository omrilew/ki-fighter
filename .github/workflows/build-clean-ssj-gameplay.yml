name: Build clean SSJ gameplay sprites
on:
  push:
    branches: [feature/forest-trial-vertical-slice]
    paths: [.github/workflows/build-clean-ssj-gameplay.yml, scripts/build_clean_ssj_gameplay.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/build_clean_ssj_gameplay.py
      - name: Commit clean SSJ gameplay PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ssj-gameplay-clean-4x4.png
          if ! git diff --cached --quiet; then
            git commit -m "Replace SSJ gameplay frames with hand-complete canonical-body sprite"
            git pull --rebase origin feature/forest-trial-vertical-slice
            git push origin HEAD:feature/forest-trial-vertical-slice
          fi
