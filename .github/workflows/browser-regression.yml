name: Browser gameplay regression
on:
  pull_request:
  push:
    branches: [main, feature/story-campaign]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ki-server.log 2>&1 &
      - run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/*-*.png
