name: Build matched 24-frame charging sprites
on:
  push:
    branches: [feature/forest-trial-vertical-slice]
    paths: [.github/workflows/build-matched-charge.yml, scripts/build_matched_charge.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install --user Pillow
      - run: python scripts/build_matched_charge.py
      - name: Commit source-matched atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/charge-normal-matched-24.png assets/charge-ssj-matched-24.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate 24-frame charge atlases matching approved Goku sprites"
            git push origin HEAD:feature/forest-trial-vertical-slice
          fi
