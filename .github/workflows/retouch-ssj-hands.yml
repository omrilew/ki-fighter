name: Retouch SSJ hands in source PNG atlases
on:
  push:
    branches: [feature/forest-trial-vertical-slice]
    paths: [.github/workflows/retouch-ssj-hands.yml, scripts/retouch_ssj_hands.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --user Pillow
      - name: Repair hand contrast directly in source PNG frames
        run: python scripts/retouch_ssj_hands.py
      - name: Commit actual PNG modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ssj-movement-4x4.png assets/ssj-production-actions-4x4.png assets/ssj-combat-actions-4x4.png
          if ! git diff --cached --quiet; then
            git commit -m "Retouch SSJ hand pixels directly in movement and combat atlases"
            git push origin HEAD:feature/forest-trial-vertical-slice
          fi
