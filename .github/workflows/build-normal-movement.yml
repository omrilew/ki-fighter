name: Build normal-form movement atlas
on:
  push:
    branches: [feature/forest-trial-vertical-slice]
    paths:
      - scripts/build-normal-movement.py
      - .github/workflows/build-normal-movement.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.1.0
      - run: python scripts/build-normal-movement.py
      - name: Commit normal movement atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/normal-movement-4x4.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate aligned normal-form movement atlas"
            git push origin HEAD:feature/forest-trial-vertical-slice
          fi
