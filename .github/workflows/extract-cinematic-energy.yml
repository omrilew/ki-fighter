name: Extract cinematic energy sprites
on:
  push:
    branches: [feature/forest-trial-vertical-slice]
    paths: [.github/workflows/extract-cinematic-energy.yml, scripts/extract_cinematic_energy.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install Pillow
      - run: python scripts/extract_cinematic_energy.py
      - name: Commit transparent energy atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/charge-blue-energy-24.png assets/kamehameha-blue-energy-16.png
          if ! git diff --cached --quiet; then
            git commit -m "Add transparent 24-frame charge and 16-frame Kamehameha energy atlases"
            git pull --rebase origin feature/forest-trial-vertical-slice
            git push origin HEAD:feature/forest-trial-vertical-slice
          fi
