name: Game smoke checks
on:
  pull_request:
  push:
    branches: [main, feature/forest-trial-vertical-slice]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check HTML script syntax and integration invariants
        run: node tests/smoke.cjs
      - name: Hero atlas manifest, anchors and gait metadata
        run: node tests/hero-atlas.test.cjs
      - name: World content kit
        run: node tests/world-content-kit.test.cjs
      - name: Hero atlas pixel validation
        run: |
          pip install pillow numpy
          python3 scripts/validate_hero_atlas.py
