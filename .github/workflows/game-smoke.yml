name: Game smoke checks
on:
  pull_request:
  push:
    branches: [main, feature/story-campaign]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check HTML script syntax and integration invariants
        run: node tests/smoke.cjs
      - name: Check character and area data contracts
        run: node --test tests/area-loader.test.cjs tests/campaign-cast.test.cjs tests/hero-atlas.test.cjs tests/animation-contract.test.js tests/world-content-kit.test.cjs
      - name: Hero atlas pixel validation
        run: |
          pip install pillow numpy
          python3 scripts/validate_hero_atlas.py
