name: Build transformation-matched auras
on:
  push:
    branches: [feature/forest-trial-vertical-slice]
    paths: [.github/workflows/build-transformation-auras.yml, scripts/extract_transformation_aura.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/extract_transformation_aura.py
      - name: Commit extracted aura atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/transformation-aura-gold-12.png assets/transformation-aura-blue-12.png
          if ! git diff --cached --quiet; then
            git commit -m "Add gold and blue auras from actual SSJ transformation frames"
            git pull --rebase origin feature/forest-trial-vertical-slice
            git push origin HEAD:feature/forest-trial-vertical-slice
          fi
