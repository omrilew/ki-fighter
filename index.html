<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ki Fighter</title></head><body><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><style>body{margin:0}</style><div id="kfg" style="height:100dvh;min-height:270px;position:relative;overflow:hidden;border-radius:12px;background:#183e22;color:white;font-family:system-ui;touch-action:none;user-select:none;-webkit-user-select:none">
<style>
#kfg *{box-sizing:border-box}
#kfg canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#kfg .ui{position:absolute;inset:0;pointer-events:none}
#kfg button{pointer-events:auto;touch-action:none;cursor:pointer;color:#fff;border:1px solid #e0eaff80;background:#192638e8;border-radius:12px;font-weight:750}
#kfg button:focus-visible{outline:2px solid #fff3a3;outline-offset:3px}
#kfg button.down,#kfg button[aria-pressed=true]{filter:brightness(1.38)}
#kfg .hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}
#kfg .vitals,#kfg .counters,#kfg .notice{color:#fff;background:#111f34e8;border:1px solid #9babce69;border-radius:10px}
#kfg .vitals,#kfg .counters{padding:8px 10px;display:grid;gap:4px}
#kfg .vital{display:grid;grid-template-columns:clamp(52px,16vw,148px) auto;align-items:center;gap:6px}
#kfg .meter{height:6px;background:#3a4561;border-radius:20px;overflow:hidden}
#kfg .meter i{display:block;height:100%;background:#ec6565;border-radius:20px;transform-origin:left}
#kfg #kfki-meter{background:#6ad9fa}
#kfg .notice{position:absolute;left:50%;transform:translateX(-50%);bottom:clamp(119px,28vw,164px);padding:6px 12px;text-align:center;font-size:12px;font-weight:750;max-width:90%}
#kfg .top{position:absolute;top:73px;right:12px;display:flex;gap:6px;align-items:flex-start}
#kfg .top button{padding:8px 12px;min-height:38px}
#kfg .powers{position:relative}
#kfg .power-menu{position:absolute;right:0;top:calc(100% + 6px);width:max-content;display:flex;gap:6px}
#kfg .power-menu[hidden]{display:none}
#kfg .controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;width:min(calc(100% - 24px),1060px);transform:translateX(-50%);display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#kfg .stick{--size:clamp(96px,24vw,134px);position:relative;flex:0 0 var(--size);width:var(--size);height:var(--size);pointer-events:auto;touch-action:none;cursor:grab;border:2px solid #d0e1fa8c;border-radius:50%;background:radial-gradient(circle,#6383ac88 32%,#152638a8 33%);box-shadow:inset 0 0 0 6px #cfddff20,0 4px 16px #18263066}
#kfg .stick-knob{position:absolute;left:30%;top:30%;width:40%;height:40%;pointer-events:none;border-radius:50%;border:2px solid #d8eaffcf;background:linear-gradient(#91aaca,#304663);box-shadow:0 3px 6px #101b35a0}
#kfg .stick.active{cursor:grabbing}
#kfg .acts{display:grid;grid-template-columns:auto auto;justify-items:center;align-items:center;gap:6px 9px}
#kfg .acts button{display:grid;place-content:center;gap:2px;width:clamp(49px,11vw,62px);aspect-ratio:1;border-radius:50%;font-size:11px;box-shadow:inset 0 2px #fff3,0 3px 10px #121c2e80}
#kfg .acts button small{font-size:9px;color:#f0f7ff}
#kfg .acts [data-a=hit]{width:clamp(68px,17vw,90px);font-size:14px;background:linear-gradient(#b95626,#76351c);border-color:#ffd59b}
#kfg .acts [data-a=ki]{width:clamp(61px,15vw,80px);background:linear-gradient(#226ca8,#16375e);border-color:#9fe7ff}
#kfg .keyboard{display:none;margin:0 0 4px;color:#fff;background:#111f34e8;border-radius:10px;padding:7px 11px;font-size:12px;text-align:center}
@media (min-width:800px) and (pointer:fine){#kfg .keyboard{display:block}}
@media (max-height:490px){#kfg .stick{--size:94px}#kfg .acts{display:flex;align-items:flex-end;gap:5px}#kfg .acts button{width:45px}#kfg .acts [data-a=ki]{width:57px}#kfg .acts [data-a=hit]{width:65px}}
#kfg #kflevel button{padding:12px 18px;font-size:15px;min-width:210px;background:#233e73}
#kfg .modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;background:#0a1737e8;z-index:3;padding:15px}
#kfg .modal h2{font:900 clamp(28px,5vw,54px) system-ui;color:#ffe07b;text-shadow:3px 3px #734623;margin:0}
#kfg .modal p{font-size:14px;line-height:1.5;max-width:360px;margin:0}
#kfg .modal button{font-size:16px;padding:10px 20px;background:#ffd06b;color:#2c2212;border:2px solid #fff8af}
#kfg .modal #kfresume{background:#253958;color:#fff;border-color:#a4b9e3}
</style>
<canvas id="kfc"></canvas>
<div class="ui">
  <div class="hud">
    <div class="vitals">
      <div class="vital"><span class="meter"><i id="kfhp-meter"></i></span><span id="kflv">LV 1</span></div>
      <div class="vital"><span class="meter"><i id="kfki-meter"></i></span><span id="kfki">100 Ki</span></div>
    </div>
    <div class="counters"><span id="kfwave">Wave 0 / 3</span><span id="kfko">0 KO</span></div>
  </div>
  <div class="notice" id="kfnotice" hidden></div>
  <div class="top">
    <div class="powers">
      <button id="kfpowers" aria-expanded="false" aria-controls="kfpower-menu">Powers</button>
      <div class="power-menu" id="kfpower-menu" hidden>
        <button data-a="fly" aria-pressed="false">Fly</button>
        <button data-a="surge" aria-pressed="false">Surge</button>
      </div>
    </div>
    <button id="kfpause">Pause</button>
  </div>
  <div class="controls">
    <div class="stick" role="img" aria-label="Movement joystick"><span class="stick-knob"></span></div>
    <p class="keyboard">WASD / Arrows to move · J Punch · K Blast · B Beam · R Charge · Space Dash · F Fly · L Surge</p>
    <div class="acts">
      <button data-a="dash">Dash</button>
      <button data-a="charge">Charge</button>
      <button data-a="ki" aria-label="Ki, tap to blast or hold for beam">Ki<small>Tap / hold</small></button>
      <button data-a="hit">Punch</button>
    </div>
  </div>
</div>
<div class="modal" id="kfmodal"><h2 id="kftitle">KI FIGHTER</h2><p id="kfdesc">Move with the joystick or WASD. Tap Ki to blast or hold it for Kamehameha. Hold Charge to refill Ki.</p><button id="kfresume" hidden>Resume</button><button id="kfplay">▶ PLAY</button></div><div id="kflevel" style="display:none;position:absolute;inset:0;z-index:6;background:#0b1539e8;align-items:center;justify-content:center;flex-direction:column;gap:10px"><h2 style="color:#ffe38a;margin:0">LEVEL UP!</h2><div id="kfpoints"></div><button data-stat="str">⚔ STR — Melee power</button><button data-stat="ki">✦ KI — Energy damage</button><button data-stat="dex">➤ DEX — Speed</button><div id="kfstats"></div></div>

function tree(t){c.save();c.translate(t.x,t.y);c.scale(t.s,t.s);fill(-8,0,16,4,'#274b26');fill(-4,-18,8,20,'#624320');fill(-2,-17,2,18,'#a77a3e');fill(-12,-30,24,18,'#205923');fill(-14,-36,28,13,'#194d20');fill(-10,-41,20,13,'#337c31');fill(-9,-38,13,5,'#56a643');fill(3,-36,8,6,'#4eae38');c.restore()}
function character(o,type,size=1){if(!spr.complete||!spr.naturalWidth)return;let row=Math.abs(o.fx)>.55?2:o.fy<-.4?1:0,frame=o.walking?Math.floor(now*9)%4:0,flip=row===2&&o.fx<0;let x=Math.round(o.x),y=Math.round(o.y);c.fillStyle='#16291f90';c.beginPath();c.ellipse(x,y+3,8*size,3*size,0,0,7);c.fill();if(type===1){c.fillStyle='#ffe76855';c.fillRect(x-16,y-39,32,38)}c.save();c.translate(x,y);if(flip)c.scale(-1,1);c.drawImage(spr,type*104+frame*26,row*36,26,36,-13*size,6-36*size,26*size,36*size);c.restore();if(o.flash>0){c.globalAlpha=.48;fill(x-12*size,y-35*size,24*size,30*size,'#fff8e6');c.globalAlpha=1}if(o.attack>0)renderPunch(o)}
function renderPunch(o){
  const progress=1-o.attack/.16;
  const extension=progress<.4?progress/.4:(1-progress)/.6;
  const side=o.combo===2?-1:1;
  const finish=o.combo===3;
  const reach=11+extension*(finish?17:13);
  c.save();
  c.translate(o.x,o.y-14);
  c.rotate(Math.atan2(o.fy,o.fx));
  const hand=side*(finish?4-8*extension:3);
  c.lineCap='round';
  c.lineJoin='round';
  c.beginPath();
  c.moveTo(1,side*5);
  c.quadraticCurveTo(reach*.55,side*(finish?10:5),reach,hand);
  c.lineWidth=6.5;
  c.strokeStyle='#412b37';
  c.stroke();
  c.lineWidth=4;
  c.strokeStyle='#edaa79';
  c.stroke();
  c.fillStyle='#d77732';
  c.beginPath();
  c.ellipse(reach-3,hand,3.7,2.8,0,0,Math.PI*2);
  c.fill();
  c.beginPath();
  c.ellipse(reach,hand,4.7,3.5,0,0,Math.PI*2);
  c.fillStyle='#f9c497';
  c.fill();
  c.lineWidth=1;
  c.strokeStyle='#643b3a';
  c.stroke();
  c.restore();
}
function render(){c.setTransform(cv.width/W,0,0,cv.height/H,0,0);c.imageSmoothingEnabled=false;let px=player?player.x:350,py=player?player.y:280,x=lim(px-W/2,0,MW-W),y=lim(py-H/2,0,MH-H);c.save();if(shake)c.translate(rnd(-1,1),rnd(-1,1));c.drawImage(map,Math.floor(x),Math.floor(y),W,H,0,0,W,H);c.translate(-Math.floor(x),-Math.floor(y));let objects=trees.map(t=>({...t,tree:true})).concat(enemies.map(e=>({...e,enemy:true})));if(player)objects.push({...player,hero:true});objects.sort((a,b)=>a.y-b.y);for(let o of objects){if(o.x<x-30||o.x>x+W+30||o.y<y-50||o.y>y+H+40)continue;if(o.tree)tree(o);else{if(o.enemy)enemyArt(o);else character(o,o.surge?1:0,1);if(o.enemy&&o.hp<o.max){const barY=o.y-(o.boss?62:43);fill(o.x-15,barY,30,3,'#1b2340');fill(o.x-14,barY+1,28*o.hp/o.max,1,'#ff7971')}}}for(let q of enemyShots){fill(q.x-3,q.y-3,7,7,'#ff8ddb')}if(player&&player.beam)renderBeam(player);for(let b of balls){c.globalAlpha=.35;fill(b.x-b.r-4,b.y-b.r-4,2*(b.r+4),2*(b.r+4),'#7cf4ff');c.globalAlpha=1;fill(b.x-b.r,b.y-b.r,2*b.r,2*b.r,'#c4faff')}for(let f of fx)fill(f.x,f.y,3,3,f.color);if(player&&held.has('charge')){let p=player;for(let j=0;j<6;j++){let a=now*6+j*1.047,r=17+Math.sin(now*8+j)*4;fill(p.x+Math.cos(a)*r,p.y-17+Math.sin(a)*r,3,7,'#8beaff')}}c.restore();renderHUD()}
const hud=Object.fromEntries(['hp-meter','ki-meter','lv','ki','wave','ko','notice'].map(key=>[key,root.querySelector('#kf'+key)]));
function renderHUD(){
  hud['hp-meter'].style.transform=`scaleX(${player?player.hp/player.max:1})`;
  hud['ki-meter'].style.transform=`scaleX(${player?player.ki/player.mki:1})`;
  const labels={lv:`LV ${player?.level??1}`,ki:`${Math.floor(player?.ki??100)} Ki`,wave:`Wave ${wave} / 3`,ko:`${kills} KO`,notice:msg};
  for(const [key,value] of Object.entries(labels)){
    if(hud[key].textContent!==value)hud[key].textContent=value;
  }
  hud.notice.hidden=messageTimer<=0;
}
function loop(t){let dt=last?Math.min(.04,(t-last)/1000):0;last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
