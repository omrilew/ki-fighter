function update(dt){now+=dt;if(messageTimer>0)messageTimer-=dt;shake=Math.max(0,shake-dt);for(let f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=125*dt;f.time-=dt}fx=fx.filter(f=>f.time>0);if(mode!=='play')return;let p=player;for(let k of ['inv','cd','attack','link','dash','dashCD'])p[k]=Math.max(0,p[k]-dt);p.ki=lim(p.ki+dt*(held.has('charge')?23:p.beam?-3:p.surge?-8:p.fly?-3:0),0,p.mki);if(p.beam){if(p.ki<=0)p.beam=0;else beamHit(dt)};if(p.ki===0){p.fly=false;p.surge=false}let dx=+held.has('right')-+held.has('left'),dy=+held.has('down')-+held.has('up'),m=hyp(dx,dy)||1;dx/=m;dy/=m;p.walking=!!(dx||dy);if(p.walking){p.fx=dx;p.fy=dy}let speed=(p.dash>0?225:p.fly?102:p.surge?85:67)*(1+(p.dex-1)*.07);p.vx+=(dx*speed-p.vx)*Math.min(1,dt*15);p.vy+=(dy*speed-p.vy)*Math.min(1,dt*15);if(p.beam||held.has('charge')){p.vx*=.45;p.vy*=.45}move(p,p.vx*dt,p.vy*dt);

for(let e of enemies){if(e.hp<=0)continue;e.flash=Math.max(0,e.flash-dt);e.cd-=dt;let dx=p.x-e.x,dy=p.y-e.y,m=hyp(dx,dy)||1;e.fx=dx/m;e.fy=dy/m;e.walking=m>23;let ranged=e.kind==='mirel';if(m>(ranged?95:23)&&m<250)move(e,e.fx*({rokan:56,vorax:28,mirel:34,garnok:29}[e.kind])*dt,e.fy*({rokan:56,vorax:28,mirel:34,garnok:29}[e.kind])*dt);if(ranged&&m<160&&e.cd<=0){e.cd=1.7;enemyShots.push({x:e.x,y:e.y-12,dx:e.fx,dy:e.fy,time:2})}if(m<(e.boss?32:23)&&e.cd<=0&&!p.fly){e.cd=e.boss?1.1:1.4;if(!p.inv){p.hp-=e.boss?18:8;p.inv=.6;shake=.14;burst(p.x,p.y-17,'#ff9191',12);if(p.hp<=0){p.hp=0;end(false)}}}}for(let e of enemies.filter(e=>e.hp<=0)){kills++;p.xp+=e.boss?100:20;burst(e.x,e.y-16,'#ffe588',15)}enemies=enemies.filter(e=>e.hp>0);if(p.xp>=p.level*55){p.xp-=p.level*55;p.level++;p.points++;p.hp=lim(p.hp+25,0,p.max);p.ki=p.mki;mode='level';showLevel()}for(let q of enemyShots){q.x+=q.dx*90*dt;q.y+=q.dy*90*dt;q.time-=dt;if(hyp(q.x-p.x,q.y-p.y+12)<12&&!p.inv){p.hp-=8;p.inv=.6;q.time=0;burst(p.x,p.y-12,'#ff9fcf',7);if(p.hp<=0)end(false)}}enemyShots=enemyShots.filter(q=>q.time>0);if(enemies.length===0){if(wave===3)end(true);else if((wait-=dt)<=0){spawn();wait=1.2}}else wait=1.2}
